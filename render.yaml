# Temporary test environment; free PostgreSQL expires after 30 days.
services:
  - type: web
    name: cardinals-nest-test
    runtime: node
    plan: free
    region: oregon
    branch: deploy/render-test
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_BOOTSTRAP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cardinals-nest-test-db
          property: connectionString

databases:
  - name: cardinals-nest-test-db
    plan: free
    region: oregon
    databaseName: cardinals_nest_test
    user: cardinals_nest
    ipAllowList: []
